[package]
name = "hpair"
version = "0.1.2"
edition = "2021"
authors = ["HPair Team <contact@hpair.dev>"]
description = "Post-quantum secure multi-linear group encryption library with one-shot key establishment"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/hyperpairing/hpair"
repository = "https://github.com/hyperpairing/hpair"
keywords = ["cryptography", "post-quantum", "encryption", "group-key", "multilinear"]
categories = ["cryptography", "algorithms", "api-bindings"]

[dependencies]
ark-poly = "0.4.0"
ark-ff = "0.4.0"
ark-std = "0.4.0"
num-bigint = { version = "0.4", features = ["rand"] }
rand = "0.8"
rand_distr = "0.4"
hex = "0.4"
sha3 = "0.10"
aes-gcm = "0.10"
generic-array = "0.14"
hkdf = "0.12"
lazy_static = "1.4"
dirs = "5.0"
once_cell = "1.19"
subtle = "2.6"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"
