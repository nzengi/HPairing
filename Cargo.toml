[package]
name = "hpair"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-poly = "0.4.0"
ark-ff = "0.4.0"
ark-std = "0.4.0"
num-bigint = { version = "0.4", features = ["rand"] }
rand = "0.8"
rand_distr = "0.4"
tokio = { version = "1", features = ["full"] }
itertools = "0.12"
hex = "0.4"
sha3 = "0.10"
aes-gcm = "0.10"
generic-array = "0.14"
hkdf = "0.12"
lazy_static = "1.4"

[dev-dependencies]

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"
